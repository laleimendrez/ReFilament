<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReFilament</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/REFILAMENT_LOGO.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="dashboard-header">
    <div class="dashboard-logo-title">
      <img src="{{ url_for('static', filename='img/REFILAMENT_LOGO.png') }}" class="logo-img" alt="ReFilament Logo">
      <span>ReFilament Analysis Interface</span>
    </div>

    <div class="system-status">
      <span class="status-text">System Operational</span>
      <span class="status-light"></span>
    </div>
  </header>

  <!-- NAVIGATION -->
  <nav class="tab-nav">
    <a href="{{ url_for('data_bp.data_page') }}" class="tab {% if request.path.startswith('/data') %}active{% endif %}">
      Classification Log
    </a>
    <a href="{{ url_for('mixture_bp.mixture_page') }}" class="tab {% if request.path.startswith('/mixture') %}active{% endif %}">
      Material Blend
    </a>
    <a href="{{ url_for('temp_bp.temp_page') }}" class="tab {% if request.path.startswith('/temperature') %}active{% endif %}" style="display: none;">
      Temperature Monitoring
    </a>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="
    {% if not request.path.startswith('/data') and not request.path.startswith('/mixture') %}
      dashboard-content
    {% endif %}
  ">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
